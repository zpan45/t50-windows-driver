[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "t50-windows-driver"
version = "0.2.0"
description = "Unofficial Windows printer for SUPVAN / Katasymbol T50M Pro label printers"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = ["pillow>=10.0.0"]
authors = [{ name = "T50 Label contributors" }]
keywords = ["printer", "label", "ipp", "hid", "supvan", "t50"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: Printing",
    "Private :: Do Not Upload",
]

[project.urls]
Homepage = "https://github.com/zpan45/t50-windows-driver"
Documentation = "https://github.com/zpan45/t50-windows-driver/tree/main/docs"

[project.scripts]
t50 = "t50.__main__:main"

[tool.setuptools.packages.find]
include = ["t50*"]
